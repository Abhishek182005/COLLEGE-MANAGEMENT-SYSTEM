services:
  - type: web
    name: campusconnect-college-erp
    runtime: python
    plan: free
    branch: production
    buildCommand: "./build.sh"
    startCommand: "gunicorn campusconnect_core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
