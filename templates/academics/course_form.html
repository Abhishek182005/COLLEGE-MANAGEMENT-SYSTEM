{% extends 'base.html' %}

{% block title %}Add Course{% endblock %}
{% block page_heading %}New Course Program{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-graduation-cap text-primary me-2"></i> Create Degree Course</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Department *</label>
                    <select name="department" class="form-select" required>
                        {% for d in departments %}
                            <option value="{{ d.id }}">{{ d.name }} ({{ d.code }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Course Code *</label>
                    <input type="text" name="code" class="form-control" placeholder="e.g. BT-CSE" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Course Name *</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. B.Tech Computer Science & Engineering" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Duration (Years)</label>
                        <input type="number" name="duration_years" class="form-control" value="4" min="1" max="6">
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold">Total Semesters</label>
                        <input type="number" name="total_semesters" class="form-control" value="8" min="1" max="12">
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">Create Course & Generate Semesters</button>
                    <a href="{% url 'course_list' %}" class="btn btn-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
